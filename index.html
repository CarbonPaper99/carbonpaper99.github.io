<script>
(function () {
  var overlay = document.getElementById('splash');
  var blue = document.getElementById('splash-blue');
  if (!overlay || !blue) return;
  var LOAD_MS = 700;    // 蓝色从左到右覆盖的动画时长
  var HOLD_MS = 80;     // 全蓝停留
  var FADE_MS = 400;    // 整层淡出
  var MAX_WAIT_MS = 4200; // 资源兜底：最迟多久开始收尾
  var ready = false, swept = false, ended = false, raf = 0, timer = 0;

  function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function update(p) {
    blue.style.clipPath = 'inset(0 ' + ((1 - p) * 100).toFixed(3) + '% 0 0)';
  }
  function maybeEnd() {
    if (!swept || ended) return;   // 纯装饰：扫完即淡出，不等真实资源
    ended = true;
    timer = setTimeout(function () {
      overlay.classList.add('is-done');
      document.body.classList.remove('splash-lock');
      overlay.setAttribute('aria-hidden', 'true');
      setTimeout(function () { overlay.style.visibility = 'hidden'; }, FADE_MS + 80);
    }, HOLD_MS);
  }
  function play() {
    var start = performance.now();
    function step(now) {
      var t = Math.min(1, (now - start) / LOAD_MS);
      update(ease(t));
      if (t < 1) raf = requestAnimationFrame(step);
      else { swept = true; update(1); maybeEnd(); }
    }
    raf = requestAnimationFrame(step);
  }
  window.addEventListener('load', function () { ready = true; maybeEnd(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) { ready = true; maybeEnd(); } });
  setTimeout(function () { ready = true; maybeEnd(); }, MAX_WAIT_MS);

  document.body.classList.add('splash-lock');
  var imgs = Array.prototype.slice.call(overlay.querySelectorAll('img'));
  var decodes = imgs.map(function (img) {
    return img.decode ? img.decode().catch(function () {}) : Promise.resolve();
  });
  Promise.all(decodes).then(play);
})();
</script>
